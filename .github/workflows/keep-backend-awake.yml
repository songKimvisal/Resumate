name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-backend-awake
  cancel-in-progress: false
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Ping /api/health
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          set -euo pipefail

          # Warn rather than fail, so an unconfigured repo does not mail you
          # a failure notice every ten minutes.
          if [ -z "${BACKEND_URL}" ]; then
            echo "::warning::BACKEND_URL repo variable is not set - nothing to ping."
            echo "Set it with: gh variable set BACKEND_URL --body 'https://<service>.onrender.com'"
            exit 0
          fi

          # %/ trims a trailing slash, so both forms of the variable work.
          url="${BACKEND_URL%/}/api/health"
          body_file="${RUNNER_TEMP:-/tmp}/health-body.txt"
          echo "Pinging ${url}"

          # --max-time 90 because a cold start can take 50s or more, and the
          # retries cover the case where this ping is the request that wakes
          # it. curl's own failure must not abort the script under `set -e`,
          # or the run ends with a bare exit code and no annotation saying why.
          set +e
          status=$(curl \
            --silent --show-error --location \
            --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 90 \
            --output "${body_file}" \
            --write-out '%{http_code}' \
            "${url}")
          curl_exit=$?
          set -e

          if [ "${curl_exit}" -ne 0 ]; then
            echo "::error::Could not reach ${url} - curl exited ${curl_exit}"
            exit 1
          fi

          echo "HTTP ${status}"
          echo "Body: $(cat "${body_file}")"

          # A sleeping service answers eventually; a broken one answers wrong.
          if [ "${status}" != "200" ]; then
            echo "::error::Backend health check returned HTTP ${status}"
            exit 1
          fi
